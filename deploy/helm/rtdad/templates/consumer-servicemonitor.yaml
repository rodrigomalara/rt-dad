apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rtdad-consumer
  labels:
    app: rtdad-consumer
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: rtdad-consumer
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
