name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format check
        run: terraform -chdir=../.. fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      # tflint config lives at infra/.tflint.hcl; pass it explicitly so the AWS
      # ruleset is active when linting the envs/staging root module.
      - name: tflint
        working-directory: infra
        run: |
          tflint --init
          tflint --config="$PWD/.tflint.hcl" --chdir=envs/staging

      - name: Configure AWS creds (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # All inputs are low-sensitivity; generate tfvars from Actions Variables
      # rather than committing a real staging.tfvars.
      - name: Generate tfvars
        run: |
          cat > staging.tfvars <<EOF
          region            = "${{ vars.AWS_REGION }}"
          whitelist_cidrs   = ${{ vars.WHITELIST_CIDRS }}
          oidc_provider_arn = "${{ vars.OIDC_PROVIDER_ARN }}"
          EOF

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      # -lock=false: the read-only plan role cannot write the S3 state lock, and
      # a plan does not mutate state. apply (local) still locks normally.
      - name: Plan (read-only)
        run: terraform plan -input=false -lock=false -var-file=staging.tfvars -no-color
