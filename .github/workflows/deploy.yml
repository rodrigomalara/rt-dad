name: deploy

on:
  workflow_dispatch:
    inputs:
      selector:
        description: "Image tag to deploy — leave blank to deploy the newest image in ECR (e.g. v1.2.3 or sha-abc1234)"
        required: false
        default: ""

permissions:
  contents: read

# Serialize deploys: overlapping runs would collide on the EKS endpoint
# allowlist update (aws eks update-cluster-config rejects concurrent updates).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGISTRY: 007374813645.dkr.ecr.us-west-2.amazonaws.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve per-image digests
        id: dig
        run: |
          SEL="${{ inputs.selector }}"
          for svc in producer consumer; do
            if [ -n "$SEL" ]; then
              d=$(aws ecr describe-images --repository-name "rtdad-${svc}" \
                --image-ids imageTag="${SEL}" \
                --query 'imageDetails[0].imageDigest' --output text)
            else
              # blank selector → newest image by push time
              d=$(aws ecr describe-images --repository-name "rtdad-${svc}" \
                --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' --output text)
            fi
            if [ "$d" = "None" ] || [ -z "$d" ]; then
              echo "no image rtdad-${svc}:${SEL:-<latest>}"; exit 1
            fi
            echo "resolved rtdad-${svc} ${SEL:-<latest>} -> ${d}"
            echo "${svc}=${d}" >> "$GITHUB_OUTPUT"
          done

      # The control-plane public endpoint is locked to a static /32 allowlist
      # (infra/modules/eks/main.tf). A GitHub-hosted runner egresses from an
      # unpredictable IP, so add it to the allowlist for the duration of the
      # job and revert unconditionally at the end.
      - name: Open EKS endpoint to this runner
        id: eks_open
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          ORIG=$(aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output json)
          echo "orig=$(echo "$ORIG" | jq -c .)" >> "$GITHUB_OUTPUT"
          if echo "$ORIG" | jq -e --arg ip "${RUNNER_IP}/32" 'index($ip)' >/dev/null; then
            echo "runner IP ${RUNNER_IP}/32 already whitelisted, nothing to do"
          else
            NEW=$(echo "$ORIG" | jq -r --arg ip "${RUNNER_IP}/32" '. + [$ip] | unique | join(",")')
            echo "adding ${RUNNER_IP}/32 -> allowlist [$NEW]"
            aws eks update-cluster-config --name "${{ vars.EKS_CLUSTER_NAME }}" \
              --resources-vpc-config publicAccessCidrs="$NEW"
            aws eks wait cluster-active --name "${{ vars.EKS_CLUSTER_NAME }}"
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }}

      - uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install rtdad deploy/helm/rtdad \
            --namespace rtdad --create-namespace \
            -f deploy/helm/rtdad/values-staging.yaml \
            --set consumer.image.digest=${{ steps.dig.outputs.consumer }} \
            --set producer.image.digest=${{ steps.dig.outputs.producer }} \
            --wait --timeout 5m

      - name: Rollout status
        run: |
          kubectl -n rtdad rollout status deploy/rtdad-consumer --timeout=180s
          kubectl -n rtdad rollout status deploy/rtdad-producer --timeout=180s

      - name: Post-deploy actuator checks (port-forward)
        run: |
          kubectl -n rtdad port-forward svc/rtdad-consumer 18080:8080 &
          PF=$!; trap 'kill $PF' EXIT
          # shellcheck disable=SC2034
          for i in $(seq 1 30); do curl -sf localhost:18080/actuator/prometheus >/dev/null && break; sleep 2; done
          scrape() { curl -sf localhost:18080/actuator/prometheus | awk -v m="$1" '$1 ~ m {v+=$2} END {printf "%d", v+0}'; }
          dead=$(scrape '^anomaly_detector_dead_letters_total')
          echo "dead_letters=$dead"
          [ "$dead" -eq 0 ] || { echo "dead letters present"; exit 1; }

      - name: Restore EKS endpoint allowlist
        if: always() && steps.eks_open.outputs.orig != ''
        run: |
          ORIG='${{ steps.eks_open.outputs.orig }}'
          RESTORE=$(echo "$ORIG" | jq -r 'join(",")')
          echo "restoring allowlist -> [$RESTORE]"
          out=$(aws eks update-cluster-config --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --resources-vpc-config publicAccessCidrs="$RESTORE" 2>&1) || {
            echo "$out"
            echo "$out" | grep -q "already at the desired configuration" \
              && { echo "allowlist already at original, nothing to restore"; exit 0; }
            exit 1
          }
          aws eks wait cluster-active --name "${{ vars.EKS_CLUSTER_NAME }}"
